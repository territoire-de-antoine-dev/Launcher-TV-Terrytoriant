name: Compiler l'APK Android TV

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -o "$RUNNER_TEMP/gradle.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/gradle-8.9/bin/gradle" :app:assembleDebug --no-daemon
          fi

      - name: Rendre l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SalonTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
